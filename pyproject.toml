[project]
name = "jonepace"
version = "1.3.0"
description = "Download the full One Pace library and official Jellyfin metadata set"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.13"
authors = [
    { name = "PierreLapolla", email = "pro@pierrelapolla.com" },
]
keywords = [
    "anime",
    "jellyfin",
    "media-server",
    "metadata",
    "one-pace",
    "torrent",
]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
]
dependencies = [
    "libtorrent>=2.0.11",
    "pandas>=3.0.2",
    "pedros>=0.12.3",
    "requests>=2.33.1",
    "rich>=15.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "pytest-cov>=6.1.1",
]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/README.md",
    "/LICENSE",
]

[tool.hatch.build.targets.wheel]
packages = ["src/jonepace"]

[project.scripts]
jonepace = "jonepace.jonepace:main"

[project.urls]
Repository = "https://github.com/PierreLapolla/onepace"

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --cov=jonepace --cov-report=html"
testpaths = ["tests"]
pythonpath = ["src"]
